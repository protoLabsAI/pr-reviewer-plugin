      alternative, running low on turns before finishing your pass — must say
      so. Reviewing blind and reporting zero findings looks IDENTICAL to a
      clean pass to everything downstream; only you know the difference.
      After your findings block, end your reply with exactly one of:

      - `FINDER_STATUS: reviewed n=<count>` — you read what this angle needed
        and completed a real pass (`count` = findings you're reporting; 0 is a
        normal, honest clean result).
      - `FINDER_STATUS: blocked reason=<short reason>` — you could not
        complete a real pass. Say briefly what stopped you (e.g. "file reads
        404ing", "out of turns before finishing").

  - id: find_structural
    subagent: structural-finder
    timeout: "{{inputs.finder_timeout}}"
    prompt: |
      Run the structural pass on PR #{{inputs.pr}} (repo: "{{inputs.repo}}" —
      empty means the default repo): call protopatch_review once and relay its
      findings verbatim. If the engine is unavailable, report the Gap it
      prescribes and an empty findings array — the panel proceeds without you.

  - id: synthesize
    subagent: review-synthesizer
    depends_on: [find_correctness, find_removed_behavior, find_crossfile, find_conventions, find_structural]
    prompt: |
      Merge these five review-finder reports on PR #{{inputs.pr}} into one
      deduped, ranked findings block (your standard procedure). The structural
      finder is the protoPatch engine — its findings carry `source:
      "protopatch"`; same rules as everyone else, preserve the attribution.

      ## Correctness finder
      {{steps.find_correctness.output}}

      ## Removed-behavior finder
      {{steps.find_removed_behavior.output}}

      ## Cross-file finder
      {{steps.find_crossfile.output}}

      ## Conventions finder
      {{steps.find_conventions.output}}

      ## Structural finder (protoPatch)
      {{steps.find_structural.output}}

  - id: verify
    subagent: verifier
    depends_on: [synthesize]
    prompt: |
      Verify these code-review findings against PR #{{inputs.pr}} (repo:
      "{{inputs.repo}}" — empty means the default repo). Re-read the actual
      diff with github_pr_diff (and github_read_file where a claim depends on
      surrounding code); annotate every finding with verdict
      confirmed/refuted/uncertain + a one-line note. Return the same fenced
      findings array, annotated — preserve every field, including `source`.

      **Begin your reply with exactly one status line**, before anything else:

      - `VERIFY_STATUS: annotated n=<count>` — you received findings and annotated
        every one of them with a verdict.
      - `VERIFY_STATUS: nothing-to-verify` — you received an empty findings array.
        This is the normal result for a clean PR and is NOT a problem; say it plainly
        rather than describing it as a gap or a pass that failed to run.

      Downstream cannot otherwise distinguish "there was nothing to check" from "the
      check did not happen", and those two mean opposite things about how much the
      verdict is worth. If you annotated some findings but not all, use `annotated`
      with the count you actually annotated and say which you skipped and why.

      Server-resolved refs (empty when not provided): head SHA
      "{{inputs.head_sha}}", base ref "{{inputs.base_ref}}".

      ## What this panel already asked for (round {{inputs.review_round}})
      <prior_requests>
      {{inputs.prior_requests}}
      </prior_requests>

      A finding whose whole substance is "this code changed / lacks a test /
      isn't explained" where the change is one the panel itself requested above
      is REFUTED — the request is the explanation. A finding that the requested
      change was implemented wrongly, incompletely, or introduced a defect
      stands on its own evidence like any other.

      ## Grounding — the verdict follows the read, not the story

      Your verdict on each finding must be DERIVED from what you actually read,
      never from how convincing the finding sounds. Two failures to avoid, both
      observed in production:

      1. **Quoted code that isn't there.** Before confirming, read the cited
         file at head SHA "{{inputs.head_sha}}" with github_read_file and locate
         the finding's quoted code IN THAT FILE. If it isn't there (and isn't on
         the minus side of the diff for a removed-behavior claim), the finding
         is REFUTED — say which quote you could not find. A finding claiming
         "X was dropped" requires you to demonstrate X's ABSENCE in the actual
         file, not to find the claim plausible.

         **But first, normalize the quote to VERBATIM — do not refute a real
         finding over a loose quote.** The `evidence` you emit for a confirmed
         finding must be the file's EXACT text: copy the bytes you read, never
         paraphrase, simplify, or stitch a composite line from separate lines.
         Finders (especially larger models) reconstruct quotes from memory —
         e.g. they write `not origin_incognito` where the file has
         `not getattr(j, "origin_incognito", False)`, or collapse a
         multi-line expression into one. When the finding's SUBSTANCE is real
         but its quote is a paraphrase of code that IS present, REPLACE the
         evidence with the exact line(s) you read, then confirm. Refute only
         when the claimed code exists in NO form — verbatim or paraphrased.
         This matters because the grounding guard downgrades a non-verbatim
         quote to `uncertain`: a real defect quoted loosely silently loses its
         power to block, so fixing the quote here is what lets it gate.

      2. **Decidable predicates you reasoned about instead of evaluating.** If a
         claim turns on what a string, prefix, regex, or comparison actually
         does — `"developer".startswith("dev.")`, `str(None)` being truthy, a
         glob matching a path — work the exact characters through, one by one,
         and write the result in your note. Do not reason "these look similar,
         so they match". A real panel confirmed that `"dev."` prefix-matches
         `"developer.env.TOKEN"`; it does not, because the fourth character is
         `e`, not `.`. That finding blocked a correct PR.

      If evidence you cannot ground is the ONLY support for a finding, mark it
      `uncertain`, not `confirmed` — uncertain never blocks a merge on its own,
      and a finding you could not verify has not earned a block.

      **A failed READ is not evidence.** The rule above is about a file you read
      that did not contain the quoted code. It does NOT apply when you could not
      read the file at all — a `github_read_file` error, a 404, an empty result.
      Those two look alike in your notes and mean opposite things: one is a weak
      finding, the other is you learning nothing. Downgrading on a failed read
      silently lifts the gate on a defect that is still there.

      Always read the cited file PINNED to head SHA "{{inputs.head_sha}}" — the
      immutable commit under review, passed as `ref=` on github_read_file. When
      that read fails at head SHA "{{inputs.head_sha}}":

      1. **Do NOT re-read the file at the branch tip** (a bare read with no
         `ref=`) and treat what you get back as this head. A rebase or force-push
         mid-review orphans the pinned SHA, and the branch tip is then a DIFFERENT
         head with possibly different code — grounding or refuting a finding
         against it silently attributes a read to a head the panel never reviewed.
         A read of another ref is not evidence about this one.
      2. **Leave the finding exactly as it was** — same severity, same
         disposition. Do NOT mark it `uncertain`, do not de-escalate major→minor.
         Label it plainly as **source unavailable**: say in your note that the
         cited file could not be read at this head, so the finding was neither
         confirmed nor refuted on its merits and its prior verdict stands
         unchanged. Source-unavailable is its OWN state — never write it up as
         refuted, or as uncertain-on-the-merits, which would claim you learned
         something you did not.

      Stale line anchors are the same trap wearing a different hat: when the head
      has moved, a finding's line number may no longer point at its code. Locate
      the finding by its quoted CODE, not by its line number, and re-anchor.

      **Evidence already on the PR counts.** If an existing review thread above
      contains a refutation with a blob citation, or a test that asserts the
      behavior the finding disputes, that is evidence — weigh it. Confirming a
      finding whose refutation is already sitting on the PR is the single most
      expensive mistake this panel makes: it burns the author's trust and costs
      a full round.

      {{steps.synthesize.output}}

  - id: report
    subagent: review-synthesizer
    depends_on: [verify]
    prompt: |
      Final pass for the review of PR #{{inputs.pr}}: the verifier has
      annotated the findings below. Drop the "refuted" ones, keep "uncertain"
      ones marked as such, re-rank, and produce the deliverable: the prose
      brief first (overall risk, fix-first item, what the panel disagreed on,
      what verification changed, any Gaps), then the canonical fenced findings
      JSON as the FINAL block of your reply.

      ## Whether verification actually happened — say the true one

      You are given the synthesized findings AND the verifier's reply, because the
      verifier's reply alone cannot tell these apart, and reporting the wrong one
      either cries wolf on every clean PR or hides a real gap:

      - Synthesized findings were an explicit EMPTY array and the verifier said
        `nothing-to-verify`: the panel found nothing. Write "no findings were raised,
        so there was nothing to verify." The empty verify pass is **not** a Gap.
      - **You cannot see the finder lanes** — only their merged result. So never claim
        coverage: no "every lane ran", "the structural pass completed", "no coverage
        gaps". The publisher stamps which lanes actually delivered, from their own
        outputs, beside your brief — and it contradicts a coverage claim that is wrong.
      - The synthesized block below carries NO findings array at all (not `[]` —
        none): the findings were lost before verification. Never call that clean or
        a pass. Say plainly that this round's findings did not arrive.
      - Findings existed and the verifier returned `annotated n=<count>` covering
        them: normal. Report what verification changed.
      - **Findings existed but the verifier returned no status line, no annotations,
        or a count short of the findings it was given: that is a real Gap.** Say so
        prominently, name how many went unverified, and state that the verdict rests
        on unverified findings. Emit `VERIFY_GAP: unverified=<count>` on its own line
        inside the brief so the publisher can withhold auto-approval.

      The PR comment is BUILT from your blocks, per your output discipline: put the
      brief between `<!-- brief -->` and `<!-- /brief -->`, ahead of the findings JSON.
      Deliberate as much as you like outside them — none of it is published, and a
      brief outside them is not published either.

      ## Account for what this panel said before

      If the prior-requests block below is non-empty, then BEFORE the findings
      JSON emit a fenced ```json block of dispositions — one row per prior
      **blocker or major**, no exceptions:

      ```json
      [{"prior": "path/to/file.py:42", "disposition": "fixed", "why": "the new
      head adds the isinstance guard ahead of the state flip"}]
      ```

      `disposition` is exactly one of `fixed` (say WHICH change fixed it),
      `open` (it survives — carry it into your findings array too), or
      `refuted` (it was wrong; say what evidence shows that).

      A prior blocker/major that simply stops being mentioned is the failure
      this exists to prevent: a confirmed major once vanished from a round into
      a clean PASS, the standing block lifted, and the defect merged 44 seconds
      later. "I didn't see it this time" is not a disposition — if you cannot
      tell whether it was fixed, say `open` and let the next round settle it.

      ## Prior requests
      <prior_requests>
      {{inputs.prior_requests}}
      </prior_requests> Carry every surviving finding's `verdict`, `note`, and
      `evidence` fields into that final JSON verbatim — a reprint that drops them
      erases the verify pass for downstream parsers, and re-paraphrasing the
      `evidence` re-breaks its grounding (the verifier normalized it to the file's
      exact text on purpose; keep it byte-for-byte).

      ## The findings as synthesized, BEFORE verification
      <synthesized>
      {{steps.synthesize.output}}
      </synthesized>

      ## The verifier's reply
      {{steps.verify.output}}
output: "{{steps.report.output}}"
